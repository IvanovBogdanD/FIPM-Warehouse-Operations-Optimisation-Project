<section id="reports-page" hidden>
  <p id="reports-status" role="status" aria-live="polite" class="mb-0"></p>
  <section id="reports-list" class="card shadow-none border" hidden>
    <div class="card-header bg-body py-3">
      <h2 class="card-title fw-semibold mb-0">Акты инвентаризации</h2>
    </div>
    <p id="reports-empty" class="card-body text-body-secondary mb-0" hidden>Сохранённых актов пока нет.</p>
    <div id="reports-table" class="table-responsive" hidden>
      <table class="table align-middle mb-0">
        <thead class="table-light">
          <tr><th scope="col">Номер акта</th><th scope="col">Дата проведения</th><th scope="col">Ответственные</th><th scope="col">Статус</th></tr>
        </thead>
        <tbody id="reports-body"></tbody>
      </table>
    </div>
  </section>
  <section id="reports-detail" hidden>
    <div class="d-flex mb-3">
      <a class="btn btn-outline-secondary" href="#reports">← Все отчёты</a>
    </div>
    <div id="reports-act" hidden>
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
        <span id="reports-act-status" class="badge"></span>
        <div class="d-flex gap-2">
          <button id="reports-download-pdf" class="btn btn-outline-secondary" type="button">Скачать PDF</button>
          <button id="reports-print" class="btn btn-primary" type="button">Печать</button>
        </div>
      </div>
      {{inventory-act}}
    </div>
  </section>
</section>
