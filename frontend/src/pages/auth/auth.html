<div class="auth-wrapper d-flex align-items-center justify-content-center" style="min-height: 80vh;">
  <div class="card shadow-sm" style="width: 400px;">
    <div class="card-header text-center">
      <h4 class="mb-0">Вход в систему</h4>
    </div>
    <div class="card-body">
      <div id="auth-error" class="alert alert-danger d-none"></div>
      
      <!-- Форма входа -->
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="login-email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input type="password" id="login-password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Войти</button>
      </form>

      <!-- Форма регистрации (скрыта) -->
      <form id="register-form" class="d-none">
        <div class="row">
          <div class="col mb-3"><input type="text" id="reg-lastName" class="form-control" placeholder="Фамилия" required></div>
          <div class="col mb-3"><input type="text" id="reg-firstName" class="form-control" placeholder="Имя" required></div>
        </div>
        <div class="mb-3"><input type="text" id="reg-middleName" class="form-control" placeholder="Отчество"></div>
        <div class="mb-3"><input type="email" id="reg-email" class="form-control" placeholder="Email" required></div>
        <div class="mb-3"><input type="password" id="reg-password" class="form-control" placeholder="Пароль" required></div>
        <div class="mb-3">
          <select id="reg-role" class="form-select" required>
            <option value="" disabled selected>Выберите роль</option>
            <option value="Кладовщик">Кладовщик</option>
            <option value="Менеджер">Менеджер</option>
          </select>
        </div>
        <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
      </form>

      <div class="text-center mt-3">
        <a href="#" id="toggle-auth-mode" class="text-decoration-none">Нет аккаунта? Регистрация</a>
      </div>
    </div>
  </div>
</div>
