<section id="movements-page" aria-label="Перемещения" hidden>
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
    <div><h1 class="h3 fw-bold mb-1">Перемещения</h1><p id="movements-summary" class="text-body-secondary mb-0">Управление размещением товаров на складе</p></div>
    <div class="d-flex gap-2"><button id="movements-cancel" class="btn btn-danger text-white" type="button" hidden>Отменить операцию</button><button id="movements-reload" class="btn btn-outline-secondary" type="button">Обновить</button></div>
  </div>
  <p id="movements-status" role="status" aria-live="polite"></p>
  <div class="row g-4 align-items-start">
    <div class="col-xl-8">
      <section class="card shadow-none border">
        <div class="card-header bg-body d-flex flex-wrap align-items-center justify-content-between gap-2">
          <h2 class="card-title fw-semibold mb-0">Ячейки склада 8×8</h2>
          <div class="d-flex flex-wrap align-items-center gap-2">
            <label class="small text-body-secondary" for="movements-product">Найти товар</label>
            <select id="movements-product" class="form-select form-select-sm" style="min-width:190px;max-width:260px"><option value="" disabled selected hidden>Выберите товар</option></select>
            <button id="movements-find" class="btn btn-sm btn-success" type="button" disabled>Найти товар</button>
            <button id="movements-back" class="btn btn-sm btn-outline-secondary" type="button" hidden>Сбросить фильтр</button>
          </div>
        </div>
        <div class="card-body"><p class="small text-body-secondary">Синие — занятые ячейки, жёлтая — выбранная, зелёные — найденный товар, бирюзовые — ячейки для объединения.</p><div id="movements-grid" class="warehouse-grid-wrap"></div></div>
      </section>
    </div>
    <div class="col-xl-4">
      <section id="movements-details-card" class="card shadow-none border">
        <div class="card-header bg-body"><h2 id="movements-cell-title" class="card-title fw-semibold mb-0">Содержимое ячейки</h2></div>
        <div class="card-body">
          <p id="movements-cell-empty" class="text-body-secondary mb-0">Выберите ячейку на карте.</p>
          <div id="movements-cell-items" class="list-group list-group-flush"></div>
          <div id="movements-actions" class="mt-3"></div>
        </div>
      </section>
    </div>
  </div>
</section>
