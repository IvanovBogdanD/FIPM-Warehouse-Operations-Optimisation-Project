<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СкладПро</title>
    
    <!-- Bootstrap (нужен для AdminLTE) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>

    <!-- 1. ЭКРАН АВТОРИЗАЦИИ (сюда JS вставит форму) -->
    <div id="auth-container"></div>

    <!-- 2. ОСНОВНОЕ ПРИЛОЖЕНИЕ (СКРЫТО ДО ВХОДА) -->
    <div id="main-app" style="display: none;">
        <!-- Верстка AdminLTE для таблицы товаров -->
        <main class="container-xl mt-4">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Товары на складе</h3>
                </div>
                <div class="card-body">
                    <form id="add-form" class="row g-2 mb-4">
                        <div class="col-md-5">
                            <input type="text" id="name" class="form-control" placeholder="Название" required>
                        </div>
                        <div class="col-md-4">
                            <input type="number" id="count" class="form-control" placeholder="Количество" required min="0">
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100">Добавить</button>
                        </div>
                    </form>

                    <div id="status" class="mb-3 text-muted">Загрузка...</div>

                    <div class="table-responsive">
                        <table id="products" class="table table-vcenter table-striped card-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Название</th>
                                    <th>Количество</th>
                                    <th class="w-1"></th>
                                </tr>
                            </thead>
                            <tbody id="products-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 3. СКРИПТЫ -->
    <script type="module" src="/src/auth.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
